name: Build Desktop App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      
      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Vérifier la structure
        run: dir
      
      - name: Installer les dépendances
        working-directory: .
        run: |
          cd Logiciel_Desktop
          npm ci
      
      - name: Compiler l'EXE
        working-directory: .
        run: |
          cd Logiciel_Desktop
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Téléverser le logiciel
        uses: actions/upload-artifact@v4
        with:
          name: UNAMDD-Desktop-Windows
          path: Logiciel_Desktop/dist/*
          retention-days: 30
          
